<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="in-title in-desc">
  <title id="in-title">Inpatient rehab, by the numbers</title>
  <desc id="in-desc">Four statistics: inpatient rehab typically runs 30 to 90 days; roughly two-thirds of clients discharged from inpatient SUD treatment report high satisfaction; around half of people with an addiction will also experience a mental health disorder; one 30-day program study found a 54.7% treatment success rate.</desc>

  <rect x="1" y="1" width="718" height="278" rx="14" fill="#FAF7F2" stroke="#EFE7DA" stroke-width="1"/>
  <rect x="1" y="1" width="718" height="5" rx="2.5" fill="#B9975B"/>

  <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">INPATIENT REHAB, BY THE NUMBERS</text>
  <line x1="40" y1="54" x2="680" y2="54" stroke="#EFE7DA" stroke-width="1"/>

  <line x1="190" y1="72" x2="190" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="350" y1="72" x2="350" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="510" y1="72" x2="510" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Column 1: typical length, calendar -->
  <g transform="translate(110,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <rect x="-9" y="-8" width="18" height="15" rx="2" fill="none" stroke="#002B5C" stroke-width="1.6"/>
    <line x1="-9" y1="-3" x2="9" y2="-3" stroke="#002B5C" stroke-width="1.6"/>
    <line x1="-4" y1="-11" x2="-4" y2="-6" stroke="#002B5C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="-11" x2="4" y2="-6" stroke="#002B5C" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="110" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="600" fill="#002B5C" text-anchor="middle">30&#8211;90 days</text>
  <text x="110" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="110" dy="0">typical length of</tspan>
    <tspan x="110" dy="16">an inpatient stay</tspan>
  </text>

  <!-- Column 2: satisfaction, thumbs up -->
  <g transform="translate(270,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <path d="M-8,10 L-8,-2 L-2,-2 L1,-10 C3,-10 4,-8 3,-6 L1,-2 L7,-2 C9,-2 10,0 8,2 L4,10 Z" fill="none" stroke="#002B5C" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="270" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="600" fill="#002B5C" text-anchor="middle">~66%</text>
  <text x="270" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="270" dy="0">report high satisfaction</tspan>
    <tspan x="270" dy="16">after discharge</tspan>
  </text>

  <!-- Column 3: co-occurring, overlapping circles -->
  <g transform="translate(430,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <circle cx="-6" cy="0" r="10" fill="none" stroke="#002B5C" stroke-width="1.6"/>
    <circle cx="6" cy="0" r="10" fill="none" stroke="#B9975B" stroke-width="1.6"/>
  </g>
  <text x="430" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="600" fill="#002B5C" text-anchor="middle">~50%</text>
  <text x="430" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="430" dy="0">also have a co-occurring</tspan>
    <tspan x="430" dy="16">mental health condition</tspan>
  </text>

  <!-- Column 4: one study's 30-day success rate -->
  <g transform="translate(590,108)">
    <circle r="24" fill="#FFFFFF" stroke="#2E7D8A" stroke-width="2"/>
    <path d="M-9,2 L-3,8 L9,-7" fill="none" stroke="#2E7D8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="590" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="600" fill="#002B5C" text-anchor="middle">54.7%*</text>
  <text x="590" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="590" dy="0">success rate in one</tspan>
    <tspan x="590" dy="16">30-day program study</tspan>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#7A7568" text-anchor="start">
    <tspan x="40" y="256">*Single-center study, not a national figure.</tspan>
    <tspan x="40" y="270">Sources: Journal of Health Psychology, Cleveland Clinic, Open Journal of Psychiatry &#8212; see Sources below</tspan>
  </text>
</svg>
