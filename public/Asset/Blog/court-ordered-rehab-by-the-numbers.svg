<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="con-title con-desc">
  <title id="con-title">Court-ordered rehab, by the numbers</title>
  <desc id="con-desc">Four statistics: 43 treatment courts operate in Arizona; more than 55% of drug court participants nationally complete the program; 65% of the US prison population has an active substance use disorder; drug court participants see up to 50% lower recidivism than those who are not in a drug court.</desc>

  <rect x="1" y="1" width="718" height="278" rx="14" fill="#FAF7F2" stroke="#EFE7DA" stroke-width="1"/>
  <rect x="1" y="1" width="718" height="5" rx="2.5" fill="#B9975B"/>

  <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">COURT-ORDERED REHAB, BY THE NUMBERS</text>
  <line x1="40" y1="54" x2="680" y2="54" stroke="#EFE7DA" stroke-width="1"/>

  <line x1="190" y1="72" x2="190" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="350" y1="72" x2="350" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="510" y1="72" x2="510" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Column 1: AZ centers, courthouse -->
  <g transform="translate(110,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <path d="M-10,8 L10,8 M-8,8 L-8,-1 M8,8 L8,-1 M-10,-1 L0,-9 L10,-1 Z" fill="none" stroke="#002B5C" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="110" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">43</text>
  <text x="110" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="110" dy="0">treatment courts</tspan>
    <tspan x="110" dy="16">operate in Arizona</tspan>
  </text>

  <!-- Column 2: completion, check -->
  <g transform="translate(270,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <path d="M-9,0 L-2,8 L10,-9" fill="none" stroke="#002B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="270" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">55%+</text>
  <text x="270" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="270" dy="0">of participants</tspan>
    <tspan x="270" dy="16">complete the program</tspan>
  </text>

  <!-- Column 3: SUD prevalence, person -->
  <g transform="translate(430,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <circle cx="0" cy="-7" r="5" fill="none" stroke="#002B5C" stroke-width="1.8"/>
    <path d="M-8,10 C-8,0 8,0 8,10" fill="none" stroke="#002B5C" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="430" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">65%</text>
  <text x="430" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="430" dy="0">of the US prison population</tspan>
    <tspan x="430" dy="16">has an active SUD</tspan>
  </text>

  <!-- Column 4: recidivism, downward arrow -->
  <g transform="translate(590,108)">
    <circle r="24" fill="#FFFFFF" stroke="#2E7D8A" stroke-width="2"/>
    <path d="M-8,-8 L8,8 M8,8 L8,-2 M8,8 L-2,8" fill="none" stroke="#2E7D8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="590" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">-50%</text>
  <text x="590" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="590" dy="0">lower recidivism among</tspan>
    <tspan x="590" dy="16">drug court participants</tspan>
  </text>

  <text x="40" y="264" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7568" text-anchor="start">Sources: National Drug Court Resource Center, NIDA, Stanford Addiction Policy — see Sources below</text>
</svg>
