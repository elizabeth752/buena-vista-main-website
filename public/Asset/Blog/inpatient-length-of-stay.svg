<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="ls-title ls-desc">
  <title id="ls-title">Inpatient rehab length of stay: 30 to 90 days</title>
  <desc id="ls-desc">A timeline from 30 to 90 days, with Buena Vista's program averaging 30 days and extending to 45 when needed. Four factors shape the length of any individual stay: which substances were used, co-occurring mental health conditions, other health conditions, and prior treatment attempts.</desc>

  <text x="40" y="34" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">WHAT SHAPES YOUR LENGTH OF STAY</text>

  <!-- timeline rail -->
  <rect x="60" y="88" width="630" height="10" rx="5" fill="#EFE7DA"/>
  <rect x="60" y="88" width="160" height="10" rx="5" fill="#2E7D8A"/>

  <!-- 30 days marker (BVR average) -->
  <circle cx="60" cy="93" r="9" fill="#FFFFFF" stroke="#002B5C" stroke-width="2.5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#002B5C" text-anchor="middle">
    <tspan x="60" y="135" font-size="18">30 days</tspan>
  </text>
  <text x="60" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B6B6B" text-anchor="middle">Buena Vista average</text>

  <!-- 45 days marker (extended) -->
  <circle cx="220" cy="93" r="9" fill="#FFFFFF" stroke="#2E7D8A" stroke-width="2.5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#002B5C" text-anchor="middle">
    <tspan x="220" y="135" font-size="18">45 days</tspan>
  </text>
  <text x="220" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B6B6B" text-anchor="middle">extended when needed</text>

  <!-- 90 days marker (upper range) -->
  <circle cx="690" cy="93" r="9" fill="#FFFFFF" stroke="#B9975B" stroke-width="2.5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#002B5C" text-anchor="end">
    <tspan x="716" y="135" font-size="18">90 days</tspan>
  </text>
  <text x="716" y="153" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B6B6B" text-anchor="end">upper end of range</text>

  <line x1="40" y1="186" x2="720" y2="186" stroke="#EFE7DA" stroke-width="1"/>
  <text x="40" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#002B5C">FOUR FACTORS THAT INFLUENCE YOUR TIMELINE</text>

  <!-- four factor chips -->
  <g>
    <rect x="40" y="228" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="40" y="228" width="4" height="62" rx="2" fill="#B9975B"/>
    <text font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#002B5C">
      <tspan x="58" y="254">Substance(s)</tspan>
      <tspan x="58" y="270">used, and for how long</tspan>
    </text>
  </g>
  <g>
    <rect x="212" y="228" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="212" y="228" width="4" height="62" rx="2" fill="#B9975B"/>
    <text font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#002B5C">
      <tspan x="230" y="254">Co-occurring</tspan>
      <tspan x="230" y="270">mental health conditions</tspan>
    </text>
  </g>
  <g>
    <rect x="384" y="228" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="384" y="228" width="4" height="62" rx="2" fill="#B9975B"/>
    <text font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#002B5C">
      <tspan x="402" y="254">Other preexisting</tspan>
      <tspan x="402" y="270">health conditions</tspan>
    </text>
  </g>
  <g>
    <rect x="556" y="228" width="160" height="62" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="556" y="228" width="4" height="62" rx="2" fill="#B9975B"/>
    <text font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#002B5C">
      <tspan x="574" y="254">Previous rehab</tspan>
      <tspan x="574" y="270">program attempts</tspan>
    </text>
  </g>
</svg>
