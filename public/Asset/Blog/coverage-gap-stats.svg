<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="cg-title cg-desc">
  <title id="cg-title">The coverage gap in addiction treatment</title>
  <desc id="cg-desc">Four statistics: rehab averages over $13,000 in the US; nearly 10% of adults under 65 are uninsured; 1 in 4 people using insurance struggled to find an in-network therapist; only 6.3% of people with a substance use disorder receive treatment.</desc>

  <rect x="1" y="1" width="718" height="278" rx="14" fill="#FAF7F2" stroke="#EFE7DA" stroke-width="1"/>
  <rect x="1" y="1" width="718" height="5" rx="2.5" fill="#B9975B"/>

  <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">THE COVERAGE GAP</text>
  <line x1="40" y1="54" x2="680" y2="54" stroke="#EFE7DA" stroke-width="1"/>

  <!-- divider lines -->
  <line x1="190" y1="72" x2="190" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="350" y1="72" x2="350" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="510" y1="72" x2="510" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Column 1: cost -->
  <g transform="translate(110,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <text x="0" y="8" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#002B5C" text-anchor="middle">$</text>
  </g>
  <text x="110" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">$13,000+</text>
  <text x="110" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="110" dy="0">average cost of</tspan>
    <tspan x="110" dy="16">rehab in the US</tspan>
  </text>

  <!-- Column 2: uninsured, shield with slash -->
  <g transform="translate(270,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <path d="M0,-11 L9,-7 V2 C9,8 4,12 0,14 C-4,12 -9,8 -9,2 V-7 Z" fill="none" stroke="#002B5C" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="-9" y1="12" x2="9" y2="-10" stroke="#B9975B" stroke-width="1.8"/>
  </g>
  <text x="270" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">~10%</text>
  <text x="270" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="270" dy="0">of adults under 65</tspan>
    <tspan x="270" dy="16">have no insurance</tspan>
  </text>

  <!-- Column 3: finding a provider, magnifying glass -->
  <g transform="translate(430,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <circle cx="-3" cy="-3" r="7" fill="none" stroke="#002B5C" stroke-width="1.8"/>
    <line x1="2" y1="2" x2="9" y2="9" stroke="#002B5C" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="430" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">1 in 4</text>
  <text x="430" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="430" dy="0">couldn't find an</tspan>
    <tspan x="430" dy="16">in-network therapist</tspan>
  </text>

  <!-- Column 4: treatment access, bar chart -->
  <g transform="translate(590,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <rect x="-10" y="2" width="5" height="10" fill="#002B5C"/>
    <rect x="-2" y="-6" width="5" height="18" fill="#002B5C"/>
    <rect x="6" y="8" width="5" height="4" fill="#B9975B"/>
  </g>
  <text x="590" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#002B5C" text-anchor="middle">6.3%</text>
  <text x="590" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="590" dy="0">of people with an SUD</tspan>
    <tspan x="590" dy="16">receive treatment</tspan>
  </text>

  <text x="40" y="264" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7568" text-anchor="start">Sources: NAATP, National Center for Drug Abuse Statistics, KFF, NAMI, NIDA — see Sources below</text>
</svg>
