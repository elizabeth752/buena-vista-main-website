<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="rn-title rn-desc">
  <title id="rn-title">Alcohol use disorder relapse, by the numbers</title>
  <desc id="rn-desc">Four statistics: more than 27 million people in the US have alcohol use disorder; around two-thirds relapse within six months of treatment; people relapse five times on average before sustained sobriety; the kindling effect can make each relapse's withdrawal more severe.</desc>

  <rect x="1" y="1" width="718" height="278" rx="14" fill="#FAF7F2" stroke="#EFE7DA" stroke-width="1"/>
  <rect x="1" y="1" width="718" height="5" rx="2.5" fill="#B9975B"/>

  <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">AUD RELAPSE, BY THE NUMBERS</text>
  <line x1="40" y1="54" x2="680" y2="54" stroke="#EFE7DA" stroke-width="1"/>

  <line x1="190" y1="72" x2="190" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="350" y1="72" x2="350" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="510" y1="72" x2="510" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Column 1: prevalence, people -->
  <g transform="translate(110,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <circle cx="-6" cy="-7" r="4.5" fill="none" stroke="#002B5C" stroke-width="1.6"/>
    <path d="M-12,9 C-12,1 0,1 0,9" fill="none" stroke="#002B5C" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="7" cy="-6" r="4" fill="none" stroke="#B9975B" stroke-width="1.6"/>
    <path d="M2,9 C2,2 13,2 13,9" fill="none" stroke="#B9975B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="110" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">27M+</text>
  <text x="110" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="110" dy="0">people in the US</tspan>
    <tspan x="110" dy="16">have AUD</tspan>
  </text>

  <!-- Column 2: relapse within 6 months, clock -->
  <g transform="translate(270,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <circle r="11" fill="none" stroke="#002B5C" stroke-width="1.6"/>
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#002B5C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="3" stroke="#002B5C" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="270" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">~66%</text>
  <text x="270" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="270" dy="0">relapse within six</tspan>
    <tspan x="270" dy="16">months of treatment</tspan>
  </text>

  <!-- Column 3: 5 average attempts, refresh/cycle -->
  <g transform="translate(430,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <path d="M-9,-2 A9,9 0 1 1 -8,4" fill="none" stroke="#002B5C" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-12,-5 L-9,-2 L-5,-5" fill="none" stroke="#002B5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="430" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">5x</text>
  <text x="430" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="430" dy="0">average relapses before</tspan>
    <tspan x="430" dy="16">sustained sobriety</tspan>
  </text>

  <!-- Column 4: kindling effect, rising bars -->
  <g transform="translate(590,108)">
    <circle r="24" fill="#FFFFFF" stroke="#2E7D8A" stroke-width="2"/>
    <rect x="-11" y="4" width="5" height="8" fill="#2E7D8A"/>
    <rect x="-3" y="-2" width="5" height="14" fill="#2E7D8A"/>
    <rect x="5" y="-9" width="5" height="21" fill="#2E7D8A"/>
  </g>
  <text x="590" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">Worsens</text>
  <text x="590" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="590" dy="0">withdrawal can intensify</tspan>
    <tspan x="590" dy="16">with each relapse</tspan>
  </text>

  <text x="40" y="264" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7568" text-anchor="start">Sources: NIAAA, Journal of Psychiatric Research, The Harvard Gazette &#8212; see Sources below</text>
</svg>
