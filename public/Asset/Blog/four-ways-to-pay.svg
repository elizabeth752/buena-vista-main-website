<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="fw-title fw-desc">
  <title id="fw-title">Four ways to pay for rehab without insurance</title>
  <desc id="fw-desc">Medicaid, paying out-of-pocket, payment plans or sliding scale fees, and community resources all lead to treatment.</desc>

  <text x="40" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">FOUR ROUTES, ONE DESTINATION</text>

  <!-- connecting curves, drawn first so the circle covers their ends -->
  <path d="M340,75 C480,75 480,210 615,169.5" fill="none" stroke="#B9975B" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <path d="M340,165 C480,165 480,210 615,196.5" fill="none" stroke="#B9975B" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <path d="M340,255 C480,255 480,210 615,223.5" fill="none" stroke="#B9975B" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <path d="M340,345 C480,345 480,210 615,250.5" fill="none" stroke="#B9975B" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>

  <!-- Card 1: Medicaid -->
  <g>
    <rect x="40" y="40" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="40" y="40" width="4" height="70" rx="2" fill="#B9975B"/>
    <circle cx="76" cy="75" r="16" fill="#FAF7F2" stroke="#002B5C" stroke-width="1.8"/>
    <path d="M69,79 L69,71 L76,67 L83,71 L83,79 L76,83 Z" fill="none" stroke="#002B5C" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="104" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#002B5C">Medicaid</text>
    <text x="104" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2B2B2B">Free or low-cost coverage if you qualify</text>
  </g>

  <!-- Card 2: Pay Out-of-Pocket -->
  <g>
    <rect x="40" y="130" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="40" y="130" width="4" height="70" rx="2" fill="#B9975B"/>
    <circle cx="76" cy="165" r="16" fill="#FAF7F2" stroke="#002B5C" stroke-width="1.8"/>
    <text x="76" y="171" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#002B5C" text-anchor="middle">$</text>
    <text x="104" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#002B5C">Pay Out-of-Pocket</text>
    <text x="104" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2B2B2B">Savings, earnings, or family support</text>
  </g>

  <!-- Card 3: Payment Plans / Sliding Scale -->
  <g>
    <rect x="40" y="220" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="40" y="220" width="4" height="70" rx="2" fill="#B9975B"/>
    <circle cx="76" cy="255" r="16" fill="#FAF7F2" stroke="#002B5C" stroke-width="1.8"/>
    <rect x="69" y="248" width="14" height="12" rx="1.5" fill="none" stroke="#002B5C" stroke-width="1.5"/>
    <line x1="69" y1="252" x2="83" y2="252" stroke="#002B5C" stroke-width="1.3"/>
    <text x="104" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#002B5C">Payment Plans</text>
    <text x="104" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2B2B2B">Spread-out charges or sliding scale fees</text>
  </g>

  <!-- Card 4: Community Resources -->
  <g>
    <rect x="40" y="310" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#EFE7DA" stroke-width="1.5"/>
    <rect x="40" y="310" width="4" height="70" rx="2" fill="#B9975B"/>
    <circle cx="76" cy="345" r="16" fill="#FAF7F2" stroke="#002B5C" stroke-width="1.8"/>
    <circle cx="71" cy="345" r="7" fill="none" stroke="#002B5C" stroke-width="1.5"/>
    <circle cx="81" cy="345" r="7" fill="none" stroke="#002B5C" stroke-width="1.5"/>
    <text x="104" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#002B5C">Community Resources</text>
    <text x="104" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2B2B2B">Grants, scholarships, crowdfunding, EAPs</text>
  </g>

  <!-- Destination circle -->
  <circle cx="650" cy="210" r="76" fill="#002B5C"/>
  <circle cx="650" cy="210" r="76" fill="none" stroke="#B9975B" stroke-width="2"/>
  <text x="650" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" fill="#FAF7F2" text-anchor="middle">Treatment</text>
  <text x="650" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.5" fill="#B9975B" text-anchor="middle">STARTS HERE</text>
</svg>
