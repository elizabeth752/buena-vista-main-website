<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="pn-title pn-desc">
  <title id="pn-title">Pregnancy and opioid addiction, by the numbers</title>
  <desc id="pn-desc">Four statistics: around 1.5 million women in the US have opioid use disorder; women are twice as likely as men to be prescribed opioids; 25 to 33 percent of pregnant women with OUD have a psychiatric comorbidity; up to 80 percent of newborns exposed to opioids in the womb develop neonatal opioid withdrawal syndrome.</desc>

  <rect x="1" y="1" width="718" height="278" rx="14" fill="#FAF7F2" stroke="#EFE7DA" stroke-width="1"/>
  <rect x="1" y="1" width="718" height="5" rx="2.5" fill="#B9975B"/>

  <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B9975B">PREGNANCY &amp; OPIOID ADDICTION, BY THE NUMBERS</text>
  <line x1="40" y1="54" x2="680" y2="54" stroke="#EFE7DA" stroke-width="1"/>

  <line x1="190" y1="72" x2="190" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="350" y1="72" x2="350" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="510" y1="72" x2="510" y2="252" stroke="#EFE7DA" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Column 1: women with OUD, people icon -->
  <g transform="translate(110,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <circle cx="-6" cy="-7" r="4.5" fill="none" stroke="#002B5C" stroke-width="1.6"/>
    <path d="M-12,9 C-12,1 0,1 0,9" fill="none" stroke="#002B5C" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="7" cy="-6" r="4" fill="none" stroke="#B9975B" stroke-width="1.6"/>
    <path d="M2,9 C2,2 13,2 13,9" fill="none" stroke="#B9975B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="110" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">1.5M+</text>
  <text x="110" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="110" dy="0">women in the US</tspan>
    <tspan x="110" dy="16">have OUD</tspan>
  </text>

  <!-- Column 2: 2x more likely prescribed opioids, capsule icon -->
  <g transform="translate(270,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <rect x="-11" y="-5" width="22" height="10" rx="5" fill="none" stroke="#002B5C" stroke-width="1.8" transform="rotate(-30)"/>
    <line x1="-1.5" y1="-6.5" x2="1.5" y2="1.5" stroke="#002B5C" stroke-width="1.4"/>
  </g>
  <text x="270" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">2x</text>
  <text x="270" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="270" dy="0">more likely to be</tspan>
    <tspan x="270" dy="16">prescribed opioids</tspan>
  </text>

  <!-- Column 3: psychiatric comorbidity, medical cross icon -->
  <g transform="translate(430,108)">
    <circle r="24" fill="#FFFFFF" stroke="#002B5C" stroke-width="2"/>
    <path d="M-2,-9 L2,-9 L2,-2 L9,-2 L9,2 L2,2 L2,9 L-2,9 L-2,2 L-9,2 L-9,-2 L-2,-2 Z" fill="#002B5C"/>
  </g>
  <text x="430" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">25&#8211;33%</text>
  <text x="430" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="430" dy="0">have a psychiatric</tspan>
    <tspan x="430" dy="16">comorbidity</tspan>
  </text>

  <!-- Column 4: NOWS, infant icon -->
  <g transform="translate(590,108)">
    <circle r="24" fill="#FFFFFF" stroke="#2E7D8A" stroke-width="2"/>
    <circle cx="0" cy="-9" r="6" fill="none" stroke="#2E7D8A" stroke-width="1.6"/>
    <path d="M-9,10 C-9,-1 9,-1 9,10 Z" fill="none" stroke="#2E7D8A" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="590" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#002B5C" text-anchor="middle">Up to 80%</text>
  <text x="590" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2B2B2B" text-anchor="middle">
    <tspan x="590" dy="0">of exposed newborns</tspan>
    <tspan x="590" dy="16">develop NOWS</tspan>
  </text>

  <text x="40" y="264" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7A7568" text-anchor="start">Sources: see Sources below</text>
</svg>
